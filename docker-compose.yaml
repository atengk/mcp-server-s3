services:
  # ----------------------------------------------------------------------------
  # 本地轻量 S3 兼容对象存储服务 (MinIO)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: mcp-s3-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API 接入端点
      - "9001:9001" # MinIO Web 控制台管理界面
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 自动初始化预建测试存储桶任务 (MinIO Client 一次性任务)
  # ----------------------------------------------------------------------------
  createbuckets:
    image: minio/mc:latest
    container_name: mcp-s3-init-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/test-bucket;
      exit 0;
      "

  # ----------------------------------------------------------------------------
  # Model Context Protocol S3 服务端 (常驻 HTTP SSE 传输模式)
  # ----------------------------------------------------------------------------
  mcp-server-s3:
    # 默认直接消费 GitHub Packages (GHCR) 预编译的多架构镜像 (amd64 / arm64)
    # 可通过环境变量 MCP_S3_IMAGE_TAG 动态锁定特定版本 (如 MCP_S3_IMAGE_TAG=v1.0.1)
    image: ghcr.io/atengk/mcp-server-s3:${MCP_S3_IMAGE_TAG:-latest}
    # 如需基于本地源码进行二次开发，注释上方 image 并解除下方 build 块注释即可:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: mcp-server-s3
    restart: unless-stopped
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      MCP_S3_TRANSPORT: "sse"
      MCP_S3_SERVER_HOST: "0.0.0.0"
      MCP_S3_SERVER_PORT: "8000"
      MCP_S3_ENDPOINT: "http://minio:9000"
      MCP_S3_REGION: "us-east-1"
      MCP_S3_ACCESS_KEY_ID: "minioadmin"
      MCP_S3_SECRET_ACCESS_KEY: "minioadmin"
      MCP_S3_FORCE_PATH_STYLE: "true"
      MCP_S3_DEFAULT_BUCKET: "test-bucket"

volumes:
  minio-data:
