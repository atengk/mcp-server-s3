name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: 生产发版、供应链溯源与 GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 GitHub Release
      id-token: write   # 签署 SLSA Provenance 防伪凭证

    steps:
      - name: 检出源码 (完整历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm 包管理器
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 配置 Node.js 运行环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org/"

      - name: 完整安装项目依赖
        run: pnpm install --frozen-lockfile || pnpm install

      - name: 执行严格类型检查 (Typecheck)
        run: pnpm typecheck

      - name: 运行全量单元测试与安全门禁 (Tests)
        run: pnpm test

      - name: 执行生产编译打包 (Build)
        run: pnpm build

      - name: 提取变更日志 (git-cliff)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_RELEASE.md

      - name: 发布至 NPM 公共注册表 (带 SLSA Provenance 供应链防伪凭据)
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view "@atengk/mcp-server-s3@${CURRENT_VERSION}" version > /dev/null 2>&1; then
            echo "版本 ${CURRENT_VERSION} 已存在于 NPM 注册表，自动跳过重复发布"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建 GitHub Release 并挂载发布内容
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: false
          files: |
            dist/index.js
            dist/index.d.ts
            dist/index.js.map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: 构建并推送 GHCR 多架构 Docker 镜像
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送至 GitHub Container Registry (ghcr.io) 所需权限

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 QEMU 模拟器 (多架构支持)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据 (Tag 与 Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送多架构镜像 (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
